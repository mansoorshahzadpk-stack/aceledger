name: Auto Deploy to Hostinger (Cache-Busted)

on:
  push:
    branches:
      - main # Triggers whenever Lovable pushes updates to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Lovable Production Files
        run: npm run build

      - name: Stage 1 - Upload Purge Script and Mirror Build Files
        run: |
          which lftp || sudo apt-get install -y lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:timeout 15;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            cd public_html;
            lcd dist/client;
            mirror -R --parallel=10 --ignore-time . .;
            quit;
          " > lftp_output1.txt 2>&1 || { cat lftp_output1.txt && exit 1; }
          cat lftp_output1.txt

      - name: Stage 2 - Execute Remote Purge of Web Server Owned Files
        run: |
          echo "Triggering remote purge of legacy ownership files..."
          RESPONSE=$(curl -is "https://aceledger.top/purge_nobody.php")
          echo "Purge script response headers & body:"
          echo "$RESPONSE"

      - name: Stage 3 - Final FTP Mirror and Cleanup
        run: |
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:timeout 15;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            cd public_html;
            lcd dist/client;
            mirror -R --parallel=10 --ignore-time . .;
            echo 'Remote public_html listing:'
            ls -la
            quit;
          " > lftp_output2.txt 2>&1 || { cat lftp_output2.txt && exit 1; }
          cat lftp_output2.txt

      - name: Verify Site is Live
        run: |
          echo "Waiting 5 seconds for files to settle..."
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://aceledger.top/")
          echo "Site status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Site is live!"
          else
            echo "⚠️ Site returned $HTTP_STATUS"
            exit 1
          fi
