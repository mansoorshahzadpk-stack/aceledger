name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main # Triggers whenever Lovable pushes updates to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Lovable Production Files
        run: npm run build

      - name: Sync Live Files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/client/        # Upload only client assets (index.html, assets, .htaccess)
          server-dir: ./                   # Upload directly to the web root
          timeout: 180000                  # Increase timeout to 3 minutes to prevent socket timeouts
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess
            **/.htaccess

      - name: Fix File Permissions on Hostinger
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set ssl:verify-certificate no;
            set cmd:fail-exit no;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            chmod 755 .;
            chmod 644 index.html;
            chmod 644 robots.txt;
            chmod 644 sitemap.xml;
            chmod 644 llms.txt;
            chmod -R 755 app-assets;
            chmod -R 755 assets;
            quit;
          " || echo "Permissions step completed (some chmod errors are expected and ignored)"
