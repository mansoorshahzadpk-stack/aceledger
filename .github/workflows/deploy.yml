name: Deploy Lovable App to Hostinger
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -d "client" ]; then
            cd client && npm install
          else
            npm install
          fi

      - name: Build Vite App
        run: |
          if [ -d "client" ]; then
            cd client && npm run build
          else
            npm run build
          fi

      - name: Sync built files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./client/dist/
          server-dir: ./
