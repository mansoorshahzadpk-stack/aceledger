name: Auto Deploy to Hostinger (Cache-Busted)

on:
  push:
    branches:
      - main # Triggers whenever Lovable pushes updates to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Lovable Production Files
        run: npm run build

      - name: Upload Build Directly via FTP Mirror
        run: |
          which lftp || sudo apt-get install -y lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:timeout 15;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            mirror -R --parallel=10 --delete --ignore-time dist/client public_html;
            quit;
          "

      - name: Verify Site is Live
        run: |
          echo "Waiting 5 seconds for files to settle..."
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://aceledger.top/")
          echo "Site status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Site is live!"
          else
            echo "⚠️ Site returned $HTTP_STATUS"
            exit 1
          fi
